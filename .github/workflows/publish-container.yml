name: Publish container image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-container
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select image tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse HEAD)
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          ALIAS_TAG=''
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$REF_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo 'Git tag is not a valid container tag.' >&2
              exit 1
            fi
            ALIAS_TAG="$REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            ALIAS_TAG=latest
          fi
          {
            echo "COMMIT=$COMMIT"
            echo "IMAGE_NAME=$IMAGE_NAME"
            echo "IMAGE=$IMAGE_NAME:sha-$COMMIT"
            echo "ALIAS_TAG=$ALIAS_TAG"
          } >> "$GITHUB_ENV"

      - name: Prepare runner disk space
        run: |
          set -euo pipefail
          DOCKER_ROOT=$(docker info --format '{{.DockerRootDir}}')
          df -h "$DOCKER_ROOT"
          # Only the unused Android SDK on this disposable GitHub-hosted runner.
          sudo rm -rf -- /usr/local/lib/android/sdk
          df -h "$DOCKER_ROOT"
          AVAILABLE_KIB=$(df -Pk "$DOCKER_ROOT" | awk 'NR == 2 {print $4}')
          if (( AVAILABLE_KIB < 20 * 1024 * 1024 )); then
            echo 'Insufficient Docker disk space: need at least 20 GiB free after runner preparation.' >&2
            exit 1
          fi

      - name: Build AMD64 image once
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --tag "$IMAGE" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label 'org.opencontainers.image.licenses=GPL-3.0-only' .

      - name: Run offline container and real stack smokes
        run: |
          set -euo pipefail
          TEST_VOLUME="h3-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker volume rm "$TEST_VOLUME"' EXIT
          docker run --rm --network none --entrypoint python "$IMAGE" /opt/h3/tests/container_smoke.py
          docker run --rm --network none --entrypoint python "$IMAGE" /opt/h3/tests/comfy_import_smoke.py
          docker volume create "$TEST_VOLUME"
          docker run --rm --network none --memory 8g --memory-swap 8g --cpus 1 -e NVIDIA_VISIBLE_DEVICES=void -v "$TEST_VOLUME:/workspace" --entrypoint python "$IMAGE" /opt/h3/tests/stack_smoke.py init
          docker run --rm --network none --memory 8g --memory-swap 8g --cpus 1 -e NVIDIA_VISIBLE_DEVICES=void -v "$TEST_VOLUME:/workspace" --entrypoint python "$IMAGE" /opt/h3/tests/stack_smoke.py check

      - name: Log in to GHCR after successful smokes
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        run: |
          set -euo pipefail
          if [[ -n "$ALIAS_TAG" ]]; then
            docker tag "$IMAGE" "$IMAGE_NAME:$ALIAS_TAG"
          fi
          docker push "$IMAGE"
          if [[ -n "$ALIAS_TAG" ]]; then
            docker push "$IMAGE_NAME:$ALIAS_TAG"
          fi

      - name: Record digest and Runpod template values
        run: |
          set -euo pipefail
          DIGEST_REF=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          PACKAGE_NAME=${IMAGE_NAME##*/}
          {
            echo '## Published container image'
            printf -- '- `%s`\n' "$IMAGE"
            if [[ -n "$ALIAS_TAG" ]]; then
              printf -- '- `%s:%s`\n' "$IMAGE_NAME" "$ALIAS_TAG"
            fi
            echo
            echo 'Use this digest for reproducible deployments:'
            echo '```text'
            echo "$DIGEST_REF"
            echo '```'
            echo 'Tags are mutable: latest moves, and rebuilding can also overwrite a commit tag.'
            echo 'Tags are pushed sequentially, not atomically.'
            printf '\n[Package](https://github.com/%s/pkgs/container/%s)\n' "$GITHUB_REPOSITORY" "$PACKAGE_NAME"
            echo 'After the first push, a package admin must set visibility to Public for anonymous pulls.'
            echo 'Public visibility cannot be reverted to Private.'
            echo
            echo '## Runpod template'
            echo '| Setting | Value |'
            echo '| --- | --- |'
            printf '| Image | `%s` |\n' "$DIGEST_REF"
            echo '| Architecture / GPU | AMD64, one NVIDIA GPU, CUDA 13 / driver 580+ |'
            echo '| Start command | Empty; use the image entrypoint |'
            echo '| HTTP ports | 8080,8081; access only via Runpod HTTPS proxy, not public TCP |'
            echo '| Persistent volume | /workspace; Network Volume to survive Pod deletion |'
            echo '| Container disk | At least 20 GiB reserve for image/runtime; model/data volume sized separately |'
            echo '| Environment | H3_AUTH_USER=h3, individual H3_AUTH_PASSWORD (16+ characters), H3_TLS_MODE=proxy; optional HF_TOKEN |'
            echo '| Initial setup via SSH | TCP 22, own H3_SSH_PUBLIC_KEY; log in as h3 and run h3-models; SSH may be removed afterward |'
            echo '| Memory | H3_MEMORY_MODE=cgroup (default); only explicitly use weaker budget mode with H3_RAM_BUDGET_GIB no greater than assigned RAM if no suitable finite limit is visible |'
            echo
            echo 'Models are not preinstalled. Readiness does not authorize generation.'
            printf '\n[Full deployment instructions](https://github.com/%s/blob/%s/DEPLOYMENT.md)\n' "$GITHUB_REPOSITORY" "$COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"
